id: PL001
line: KR
concept: 일요일 오전 10시, 햇살 드는 카페 창가 자리에서 작업하는 1시간 반.
title: "일요일 오전 10시, 창가 자리에서 작업할 때 듣는 플리 ☕"
curation_note: |
  카페에 도착해 주문하는 순간부터 노트북을 덮고 나서는 순간까지의 흐름으로 묶었습니다.
  작업에 방해되지 않도록 처음부터 끝까지 잔잔하게, 중간에 한 번만 햇살처럼 밝아집니다.
  마지막 곡이 첫 곡으로 자연스럽게 이어지니 반복 재생해 두셔도 좋아요.
