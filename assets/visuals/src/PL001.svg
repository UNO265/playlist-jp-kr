<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDDEE"/>
      <stop offset="0.7" stop-color="#EAF2EC"/>
      <stop offset="1" stop-color="#F8EFD9"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD6BA"/>
      <stop offset="1" stop-color="#F3E4CC"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C08A5C"/>
      <stop offset="1" stop-color="#9C6A43"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8E6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF8E6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#FFF6D8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="win"><rect x="300" y="110" width="1320" height="600"/></clipPath>
  </defs>

  <!-- wall -->
  <rect width="1920" height="1080" fill="url(#wall)"/>

  <!-- outside view -->
  <g clip-path="url(#win)">
    <rect x="300" y="110" width="1320" height="600" fill="url(#sky)"/>
    <rect x="300" y="110" width="1320" height="600" fill="url(#glow)"/>
    <!-- far buildings -->
    <g opacity="0.55">
      <rect x="320" y="330" width="170" height="380" fill="#D9C7B4"/>
      <rect x="500" y="290" width="140" height="420" fill="#E4D3C0"/>
      <rect x="1180" y="310" width="160" height="400" fill="#D6C5B6"/>
      <rect x="1350" y="350" width="200" height="360" fill="#E2D2C2"/>
      <g fill="#F4ECE0">
        <rect x="345" y="360" width="30" height="40"/><rect x="400" y="360" width="30" height="40"/><rect x="345" y="430" width="30" height="40"/><rect x="400" y="430" width="30" height="40"/>
        <rect x="525" y="320" width="28" height="38"/><rect x="580" y="320" width="28" height="38"/><rect x="525" y="390" width="28" height="38"/><rect x="580" y="390" width="28" height="38"/>
        <rect x="1205" y="340" width="30" height="40"/><rect x="1265" y="340" width="30" height="40"/><rect x="1205" y="410" width="30" height="40"/><rect x="1265" y="410" width="30" height="40"/>
        <rect x="1380" y="380" width="34" height="40"/><rect x="1440" y="380" width="34" height="40"/><rect x="1500" y="380" width="34" height="40"/>
      </g>
    </g>
    <!-- sidewalk -->
    <rect x="300" y="640" width="1320" height="70" fill="#E9DCC8"/>
    <!-- trees -->
    <g>
      <rect x="455" y="470" width="18" height="190" fill="#7A5638"/>
      <g fill="#F2C14E"><circle cx="465" cy="420" r="95"/><circle cx="395" cy="470" r="65"/><circle cx="540" cy="465" r="70"/></g>
      <g fill="#F7D57A" opacity="0.8"><circle cx="440" cy="390" r="40"/><circle cx="510" cy="430" r="30"/></g>

      <rect x="845" y="440" width="20" height="220" fill="#7A5638"/>
      <g fill="#E58A47"><circle cx="855" cy="380" r="115"/><circle cx="770" cy="440" r="75"/><circle cx="945" cy="440" r="80"/></g>
      <g fill="#F0A867" opacity="0.8"><circle cx="820" cy="345" r="45"/><circle cx="900" cy="400" r="38"/></g>

      <rect x="1255" y="480" width="18" height="180" fill="#7A5638"/>
      <g fill="#EDB04A"><circle cx="1265" cy="430" r="95"/><circle cx="1190" cy="480" r="62"/><circle cx="1335" cy="475" r="68"/></g>
      <g fill="#F6CC6E" opacity="0.8"><circle cx="1240" cy="400" r="38"/></g>
    </g>
    <!-- falling leaves -->
    <g fill="#E9A94A">
      <ellipse cx="640" cy="560" rx="9" ry="5" transform="rotate(30 640 560)"/>
      <ellipse cx="1040" cy="520" rx="9" ry="5" transform="rotate(-20 1040 520)"/>
      <ellipse cx="1110" cy="610" rx="8" ry="4" transform="rotate(50 1110 610)"/>
      <ellipse cx="700" cy="630" rx="8" ry="4" transform="rotate(-40 700 630)"/>
    </g>
  </g>

  <!-- window frame -->
  <g fill="#8A5C3B">
    <rect x="280" y="90" width="1360" height="24"/>
    <rect x="280" y="706" width="1360" height="20"/>
    <rect x="280" y="90" width="24" height="636"/>
    <rect x="1616" y="90" width="24" height="636"/>
    <rect x="948" y="90" width="22" height="636"/>
    <rect x="300" y="400" width="1320" height="14"/>
  </g>
  <rect x="260" y="720" width="1400" height="26" rx="4" fill="#9E6C47"/>

  <!-- pendant lamp -->
  <rect x="1748" y="0" width="4" height="180" fill="#5E4330"/>
  <path d="M1690 230 Q1750 160 1810 230 Z" fill="#2F5D50"/>
  <ellipse cx="1750" cy="232" rx="22" ry="8" fill="#FFE7A8"/>

  <!-- plant on sill -->
  <path d="M190 742 L210 640 L290 640 L310 742 Z" fill="#C9734A"/>
  <g fill="#4E8A5E">
    <ellipse cx="225" cy="590" rx="22" ry="60" transform="rotate(-25 225 590)"/>
    <ellipse cx="255" cy="570" rx="22" ry="72"/>
    <ellipse cx="285" cy="595" rx="22" ry="58" transform="rotate(28 285 595)"/>
  </g>
  <g fill="#6BA77A">
    <ellipse cx="240" cy="600" rx="12" ry="40" transform="rotate(-10 240 600)"/>
    <ellipse cx="272" cy="600" rx="12" ry="40" transform="rotate(14 272 600)"/>
  </g>

  <!-- table -->
  <rect x="0" y="790" width="1920" height="290" fill="url(#table)"/>
  <rect x="0" y="790" width="1920" height="14" fill="#D29C6C"/>

  <!-- sunlight beams -->
  <polygon points="1000,804 1600,804 1420,1080 700,1080" fill="url(#beam)" opacity="0.7"/>
  <polygon points="330,804 930,804 780,1080 150,1080" fill="url(#beam)" opacity="0.45"/>

  <!-- window shadow on table -->
  <polygon points="760,860 840,860 780,1080 690,1080" fill="#7E5233" opacity="0.18"/>

  <!-- laptop -->
  <polygon points="620,800 1040,800 1080,830 580,830" fill="#C7CCD1"/>
  <polygon points="660,560 1000,560 1030,800 630,800" fill="#9AA3AB"/>
  <polygon points="672,572 990,572 1016,792 644,792" fill="#AEB6BD"/>
  <circle cx="830" cy="680" r="14" fill="#C9CFD4"/>
  <rect x="580" y="826" width="500" height="10" rx="4" fill="#A9AFB5"/>

  <!-- notebook + pen -->
  <polygon points="1130,880 1420,860 1450,960 1150,985" fill="#F7F1E6"/>
  <polygon points="1130,880 1145,880 1165,985 1150,985" fill="#E58A47"/>
  <g stroke="#D8CDBD" stroke-width="3">
    <line x1="1180" y1="905" x2="1410" y2="888"/><line x1="1186" y1="930" x2="1418" y2="913"/><line x1="1192" y1="955" x2="1426" y2="938"/>
  </g>
  <rect x="1300" y="975" width="170" height="10" rx="5" fill="#2F5D50" transform="rotate(-12 1300 975)"/>

  <!-- coffee -->
  <ellipse cx="1290" cy="815" rx="120" ry="24" fill="#F4EEE6"/>
  <ellipse cx="1290" cy="810" rx="96" ry="16" fill="#E8DFD3"/>
  <path d="M1220 680 L1360 680 L1345 800 Q1290 820 1235 800 Z" fill="#FBF8F3"/>
  <ellipse cx="1290" cy="680" rx="70" ry="16" fill="#FBF8F3"/>
  <ellipse cx="1290" cy="682" rx="60" ry="12" fill="#B07B4F"/>
  <path d="M1272 682 Q1290 670 1308 682 Q1290 690 1272 682 Z" fill="#F2E3CF"/>
  <path d="M1356 705 Q1405 712 1395 745 Q1385 772 1348 770" fill="none" stroke="#FBF8F3" stroke-width="14"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <path d="M1270 655 Q1255 625 1272 600 Q1288 575 1272 545"/>
    <path d="M1305 650 Q1322 620 1305 595 Q1290 570 1308 540"/>
  </g>
</svg>
